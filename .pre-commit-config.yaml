# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: mixed-line-ending
    -   id: check-case-conflict
    -   id: check-ast
    -   id: check-toml
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: ^uv\.lock$
    -   id: end-of-file-fixer

-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell

-   repo: local
    hooks:
    -   id: zizmor
        name: zizmor
        entry: uv run zizmor .github
        language: system
        files: ^\.github/
        require_serial: true
        pass_filenames: false

    -   id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
        require_serial: true
        pass_filenames: false

    -   id: ruff
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

    -   id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

    -   id: mypy
        name: Mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
