name: Deploy Documentation

on:
  workflow_dispatch: null
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:  # zizmor: ignore[artipacked]
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Build docs
        run: uv run --group docs mkdocs build --strict -f docs/mkdocs.yml
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      # The history of gh-pages is kept to one commit, as the deployed site is large.
      - name: Deploy to gh-pages
        run: uv run --group docs mkdocs gh-deploy --force --no-history -f docs/mkdocs.yml
