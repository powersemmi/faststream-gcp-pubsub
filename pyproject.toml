[build-system]
requires = ["uv_build>=0.9.2,<0.14.0"]
build-backend = "uv_build"

[project]
name = "faststream-gcp-pubsub"
version = "0.1.0"
description = "Google Cloud Pub/Sub broker for FastStream"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["faststream", "google cloud", "pubsub", "gcp", "asyncio", "messaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    # broker-author internals (`faststream._internal`) are stable within a minor line
    "faststream>=0.7.7,<0.8",
    "google-cloud-pubsub>=2.26,<3",
]

[project.optional-dependencies]
otel = ["faststream[otel]>=0.7.7,<0.8"]
prometheus = ["faststream[prometheus]>=0.7.7,<0.8"]
cli = ["faststream[cli]>=0.7.7,<0.8"]

[project.urls]
Homepage = "https://github.com/powersemmi/faststream-gcp-pubsub"
Source = "https://github.com/powersemmi/faststream-gcp-pubsub"
Tracker = "https://github.com/powersemmi/faststream-gcp-pubsub/issues"

[tool.uv.build-backend]
module-root = ""
module-name = "faststream_gcp_pubsub"

[dependency-groups]
lint = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "types-protobuf",
]
testing = [
    "dirty-equals==0.11",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-timeout>=2.4.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.0.0,<3.0.0",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "prometheus-client>=0.20.0,<0.30.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "mkdocstrings-python==2.0.9",
    "mkdocs-autorefs==1.4.4",
    # newer releases break mkdocstrings 1.0.2 (`Highlight.__init__() missing md`)
    "pymdown-extensions==12.3",
    "markdown==3.10.3",
]
dev = [
    { include-group = "lint" },
    { include-group = "testing" },
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
files = ["faststream_gcp_pubsub", "tests", "docs/docs_src"]
strict = true
python_version = "3.10"
strict_bytes = true
local_partial_types = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = false
# google-auth and the GAPIC transports ship untyped functions
untyped_calls_exclude = ["google"]
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
# Cross-broker testcases hold the broker as `Any`: each broker spells
# `subscriber()` differently, so its decorator cannot be typed there.
module = [
    "tests.asyncapi.base.*",
    "tests.opentelemetry.basic",
    "tests.prometheus.basic",
    "tests.brokers.base.*",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# AsyncAPI tests declare handlers only for their signature: the body never runs.
module = ["tests.asyncapi.*"]
disable_error_code = ["empty-body"]

[tool.pytest.ini_options]
minversion = "7.0"
timeout = 30
timeout_func_only = true
addopts = "--strict-markers --strict-config -q -m 'not gcp'"
xfail_strict = true
testpaths = ["tests"]
markers = [
    "gcp: live test against the Pub/Sub emulator",
    "connected",
    "slow",
    "all",
]
asyncio_default_fixture_loop_scope = "function"
